name: VERA Packet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m py_compile vera_packet_v0_3.py payment/checkout.py
      - run: python -m pytest tests/ -q
      - name: Hygiene
        run: |
          test -f LICENSE
          test -f README.md
          test -f .gitignore
